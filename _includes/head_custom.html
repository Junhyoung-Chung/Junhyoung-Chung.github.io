{% if jekyll.environment == 'production' and site.analytics.measurement_id %}
  {% include analytics.html %}
{% endif %}
{% if page.materials_view %}
<script src="{{ '/assets/js/materials.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
{% endif %}
{% if page.math %}
<script>
window.MathJax = {tex: {inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true}, options: {skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-chtml.js"></script>
{% endif %}
