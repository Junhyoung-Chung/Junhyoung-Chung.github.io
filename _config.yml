title: Junhyoung Chung
description: Statistics Ph.D. student at UC Davis. Research in optimal transport, graphical models, and robust statistical learning.
url: https://junhyoung-chung.github.io
baseurl: ""
lang: en
timezone: America/Los_Angeles
author: Junhyoung Chung
theme: just-the-docs
color_scheme: academic
permalink: date
search_enabled: false
heading_anchors: false
enable_copy_code_button: false
back_to_top: false
gh_edit_link: false
nav_sort: case_sensitive
nav_external_links:
  - title: CV
    url: /assets/CV.pdf
    hide_icon: false
    opens_in_new_tab: true
favicon_ico: /favicon.ico

# Do not also set ga_tracking: the custom include below prevents preview tracking.
analytics:
  measurement_id: G-CH97FJJG6N
  production_hostname: junhyoung-chung.github.io
cv_updated: Oct 2026

collections:
  materials:
    output: true
    permalink: /materials/:name/
defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/images/profile.jpg
  - scope:
      path: ""
      type: materials
    values:
      layout: material
      nav_exclude: true
      materials_view: true
plugins:
  - jekyll-seo-tag
  - jekyll-include-cache
  - jekyll-sitemap
kramdown:
  input: GFM
  syntax_highlighter: rouge
sass:
  style: compressed
  quiet_deps: true
  silence_deprecations: [import, global-builtin, color-functions]
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - DESIGN.md
  - MIGRATION.md
  - LICENSE
  - scripts
  - tests
  - review
  - vendor
  - .bundle
  - .omx
  - .ruby-version
  - _site-production
  - _site-prefix
