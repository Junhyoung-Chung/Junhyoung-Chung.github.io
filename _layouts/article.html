---
layout: default
---
<p class="eyebrow"><a href="{{ '/archive/' | relative_url }}">Writing archive</a></p>
<h1>{{ page.title }}</h1>
<p class="article-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
<div class="archived-article">{{ content }}</div>
